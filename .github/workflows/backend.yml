name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint y formato (Ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        run: uv sync

      - name: Comprobar estilo
        run: uv run ruff check .

      - name: Comprobar formato
        run: uv run ruff format --check .

  tests:
    name: "Tests y cobertura"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        run: uv sync

      - name: Ejecutar tests con cobertura
        run: uv run pytest --tb=short --cov=app --cov-report=term-missing --cov-fail-under=60
        env:
          ENVIRONMENT: development
          LLM_PROVIDER: ollama