[project]
name = "finsight-research"
version = "0.1.0"
description = "Offline research environment for the FinSight deep learning module"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "torch>=2.4.1",
    "vmdpy>=0.2",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.5.2",
    "optuna>=4.0.0",
    "matplotlib>=3.9.2",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
