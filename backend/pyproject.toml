[project]
name = "finsight-backend"
version = "0.1.0"
description = "Plataforma web de análisis financiero de acciones del Nasdaq — TFG ULE"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    # Settings
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    # LLM providers
    "httpx>=0.27.2",
    # Database
    "neo4j>=5.24.0",
    # Data / ML
    "yfinance>=0.2.43",
    "finnhub-python>=2.4.20",
    "torch>=2.4.1",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    # Scheduler
    "apscheduler>=3.10.4",
    # Utilities
    "cachetools>=5.5.0",
    "openai>=2.41.0",
    "neo4j-graphrag>=1.17.0",
    "requests>=2.34.2",
    "lxml>=6.1.1",
    "scipy>=1.17.1",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.15.16",
    "pytest-cov>=7.1.0",
]

# On Linux, PyPI's torch wheel bundles the full CUDA/NVIDIA stack (cuda-toolkit,
# nvidia-cublas, nvidia-cudnn, nccl, triton...), which is dead weight on Render's
# GPU-less free tier and bloats the process memory footprint. Pin torch to the
# CPU-only wheel there. On Windows/macOS PyPI's torch is already CPU-only, so
# this leaves local development unchanged.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI usa llamadas a funciones en argumentos por defecto (Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert está permitido en tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
